name: Foundation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundation
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring, dom, xml, fileinfo, gd, curl, zip
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure isolated test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php -r 'if (!function_exists("imagewebp")) { fwrite(STDERR, "GD WebP support required\n"); exit(1); }'
      - name: Validate PHP configuration and style
        run: |
          composer validate --strict
          composer check-platform-reqs
          php vendor/bin/pint --test
      - name: Run complete existing test suite
        run: php artisan test
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript and production assets
        run: npm run check
      # No deployment, production secrets, persistent DB, or initialization seeders.
